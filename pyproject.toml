[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facteval"
version = "0.1.0"
description = "Claim-level factuality evaluation with calibrated confidence."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "FactEval Contributors"},
]
keywords = ["factuality", "hallucination", "NLI", "LLM", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "transformers>=4.36",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "datasets>=2.14",
    "accelerate>=0.25",
    "numpy>=1.24",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
demo = [
    "gradio>=4.0",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]
quantize = [
    "bitsandbytes>=0.41",
]

[project.scripts]
facteval = "facteval.cli:main"

[tool.setuptools.packages.find]
include = ["facteval*"]

[tool.ruff]
line-length = 100
target-version = "py310"
